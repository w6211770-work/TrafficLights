<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>信号機リアルタイムモニター（音声検知対応）</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="night">

    <div class="header">
        <select id="signalSelect"></select>
        <div class="clock" id="currentClock">現在時刻: --:--:--</div>
        <div class="audio-status" id="audioStatus">音声検知: 画面をタップしてマイクを有効化してください</div>
    </div>

    <div class="main-display">
        <div class="signal-label" id="signalText">読み込み中...</div>
        <div class="countdown" id="countdownText">--</div>
        <div class="unit" id="unitText">秒</div>
    </div>

    <div class="footer" id="cycleInfo">
        サイクル情報: --
    </div>

    <script src="script.js"></script>
</body>
</html>
